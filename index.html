<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tacógrafo Pro V5 — VDO Sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<style>
  :root{
    --c-drive:#f59e0b; --c-work:#3b82f6; --c-avail:#94a3b8; --c-rest:#22c55e;
    --c-drive-bg:rgba(245,158,11,.15); --c-work-bg:rgba(59,130,246,.15);
    --bg:#0b1220; --surface:#111c30; --surface-2:#0f172a; --text:#e2e8f0; --muted:#94a3b8;
    --border:#1e293b; --danger:#dc2626; --radius:12px;
    --font-ui:'Barlow',system-ui,sans-serif; --font-num:'Barlow Condensed',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    font-family:var(--font-ui); background:var(--bg); color:var(--text);
    display:flex; flex-direction:column; justify-content:space-between;
    padding: calc(env(safe-area-inset-top) + 4px) 10px calc(env(safe-area-inset-bottom) + 56px) 10px;
    font-size:14px; -webkit-font-smoothing:antialiased; transition: background 0.3s;
  }

  /* ALERTAS LUMINOSOS */
  body.flash-red { animation: flashRed 0.6s infinite alternate; }
  body.flash-yellow { animation: flashYellow 1s infinite alternate; }
  @keyframes flashRed { 0%{background-color:var(--bg);} 100%{background-color:#7f1d1d;} }
  @keyframes flashYellow { 0%{background-color:var(--bg);} 100%{background-color:#78350f;} }

  .num{font-family:var(--font-num);font-variant-numeric:tabular-nums;}
  
  /* TOPO MELHORADO */
  .top-bar { display:flex; justify-content:space-between; align-items:center; background:var(--surface); padding:10px 14px; border-radius:var(--radius); border:1px solid var(--border); }
  .clock-mini { font-family:var(--font-num); font-size:36px; font-weight:700; color:#fff; line-height:1; letter-spacing:1px; }
  .speed-val { font-family:var(--font-num); font-size:38px; font-weight:700; color:#38bdf8; line-height:1; }
  .driver-text { font-size:11px; color:var(--muted); margin-top:2px; }
  .odo-text { font-size:12px; color:#22c55e; font-weight:600; text-align:right; }

  /* GRELHA E CARTÕES */
  .grid-timers { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:6px 0 2px 0; }
  .card-compact { background:var(--surface); border-radius:var(--radius); padding:8px 10px; border:1px solid var(--border); text-align:center; }
  .card-compact h2 { font-size:10px; text-transform:uppercase; color:var(--muted); margin:0 0 2px 0; font-weight:600; }
  .metric-num { font-family:var(--font-num); font-size:32px; font-weight:700; line-height:1; }
  .metric-sub { font-size:11px; color:var(--muted); margin-top:2px; }

  /* BOTÕES DE ATIVIDADE */
  .activities-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin:8px 0; }
  .act-btn {
    background:var(--surface-2); border:1.5px solid var(--border); border-radius:10px;
    padding:6px 2px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; min-height:52px; cursor:pointer; color:var(--text);
  }
  .act-btn svg { width:18px; height:18px; }
  .act-btn span { font-size:10px; font-weight:600; text-align:center; }
  
  .act-btn[data-key="D"] { color:var(--c-drive); }
  .act-btn[data-key="T"], .act-btn[data-key="L"] { color:var(--c-work); }
  .act-btn[data-key="A"] { color:var(--c-avail); }
  .act-btn[data-key="R"], .act-btn[data-key="C"], .act-btn[data-key="F"] { color:var(--c-rest); }

  .act-btn.active { background:var(--surface); border-width:2px; }
  .act-btn.active[data-key="D"] { border-color:var(--c-drive); background:var(--c-drive-bg); }
  .act-btn.active[data-key="T"], .act-btn.active[data-key="L"] { border-color:var(--c-work); background:var(--c-work-bg); }
  .act-btn.active[data-key="R"], .act-btn.active[data-key="C"], .act-btn.active[data-key="F"] { border-color:var(--c-rest); background:rgba(34,197,94,.15); }

  .stats-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin:6px 0; text-align:center; }
  .stat-box { background:var(--surface); padding:6px; border-radius:8px; border:1px solid var(--border); }
  .stat-box .v { font-family:var(--font-num); font-size:16px; font-weight:700; }
  .stat-box .k { font-size:9px; color:var(--muted); text-transform:uppercase; }

  /* AÇÕES INFERIORES */
  .action-buttons { display:grid; grid-template-columns:1.5fr 1fr 1fr; gap:6px; margin-top:4px; }
  .btn {
    display:flex; align-items:center; justify-content:center; gap:4px; border-radius:10px;
    font-weight:700; font-size:13px; min-height:46px; border:none; color:#fff; background:var(--c-work); cursor:pointer;
  }
  .btn.danger { background:var(--danger); }
  .btn.secondary { background:var(--surface-2); border:1px solid var(--border); color:var(--text); }

  .bottomnav {
    position:fixed; bottom:0; left:0; right:0; height:50px;
    background:var(--surface); border-top:1px solid var(--border);
    display:grid; grid-template-columns:repeat(3, 1fr); z-index:50;
  }
  .bottomnav button {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:10px; color:var(--muted); font-weight:600; border:none; background:none;
  }
  .bottomnav button.active { color:var(--c-work); }

  .tab { display:none; height:100%; overflow-y:auto; }
  .tab.active { display:flex; flex-direction:column; justify-content:space-between; }
  .start-screen { max-width:480px; margin:auto; width:100%; padding:12px; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:100; display:flex; align-items:center; justify-content:center; padding:14px; }
  .hidden { display:none !important; }
  
  input, select {
    width:100%; padding:10px; background:var(--surface-2); border:1px solid var(--border);
    color:#fff; border-radius:8px; font-size:14px; margin-top:4px;
  }
</style>
</head>
<body>

<!-- PÁGINA INICIAL / INSERÇÃO DE CARTÃO VDO -->
<div id="startScreen" class="start-screen">
  <div style="background:var(--surface);padding:16px;border-radius:14px;border:1px solid var(--border);">
    <h1 style="text-align:center;font-family:var(--font-num);font-size:30px;margin:0 0 2px 0;">Tacógrafo Pro V5</h1>
    <p style="text-align:center;color:var(--muted);font-size:11px;margin:0 0 14px 0;">Simulação de Cartão VDO & GPS ODO</p>
    
    <div style="margin-bottom:10px;">
      <label style="font-size:11px;color:var(--muted);">Cartão de Condutor (Perfil)</label>
      <select id="userSelect" onchange="checkUserRestStatus()"></select>
    </div>

    <div style="margin-bottom:10px;">
      <label style="font-size:11px;color:var(--muted);">Matrícula do Veículo</label>
      <input type="text" id="sPlate" placeholder="AA-00-AA" autocapitalize="characters">
    </div>

    <div style="margin-bottom:14px;">
      <label style="font-size:11px;color:var(--muted);">ODO Início Painel (km)</label>
      <input type="number" id="sOdo" placeholder="Ex: 970000">
    </div>

    <div id="restWarning" style="display:none;background:rgba(234,179,8,0.15);border:1px solid #eab308;color:#eab308;padding:8px;border-radius:8px;font-size:11px;margin-bottom:12px;text-align:center;"></div>

    <button class="btn" id="btnStart" style="width:100%;margin-bottom:8px;background:var(--c-rest);">💳 Inserir Cartão / Iniciar Jornada</button>
    <button class="btn secondary" onclick="openReportsModal()" style="width:100%;">📊 Consultar Relatórios sem Logar</button>
  </div>
</div>

<!-- APP PRINCIPAL DA JORNADA -->
<div id="app" class="hidden" style="height:100%; display:flex; flex-direction:column;">
  
  <!-- TOPO MODIFICADO (Fonte maior) -->
  <div class="top-bar">
    <div>
      <div class="clock-mini num" id="clockTime">00:00:00</div>
      <div class="driver-text" id="driverDisplay">---</div>
    </div>
    <div style="text-align:right;">
      <div class="speed-val num"><span id="gpsSpeed">0</span> <span style="font-size:16px;color:#94a3b8;">km/h</span></div>
      <div class="odo-text num" id="odoDisplay">ODO: 0 km</div>
    </div>
  </div>

  <div class="tab active" id="tab-hoje">
    <!-- Cronómetros -->
    <div class="grid-timers">
      <div class="card-compact">
        <h2>Condução Contínua</h2>
        <div class="metric-num num" id="contTimer" style="color:var(--c-drive);">4:30:00</div>
        <div class="metric-sub" id="contSub">Efetuado: 0h00</div>
      </div>
      <div class="card-compact">
        <h2>Condução Diária</h2>
        <div class="metric-num num" id="dailyTimer" style="color:var(--c-drive);">9h00</div>
        <div class="metric-sub" id="dailySub">Efetuado: 0h00</div>
      </div>
    </div>

    <!-- Botões de Atividade mais próximos -->
    <div style="font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:600;margin:6px 0 2px 0;">Atividade Atual (GPS Automático)</div>
    <div class="activities-grid">
      <button class="act-btn" data-key="D" onclick="setActivity('D')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Condução</span>
      </button>
      <button class="act-btn" data-key="T" onclick="setActivity('T')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 6.5l3 3L9 18l-3 1 1-3z"/></svg>
        <span>Trabalho</span>
      </button>
      <button class="act-btn" data-key="L" onclick="setActivity('L')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/></svg>
        <span>Carga</span>
      </button>
      <button class="act-btn" data-key="A" onclick="setActivity('A')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 21L21 3"/></svg>
        <span>Disponíb.</span>
      </button>
      <button class="act-btn" data-key="R" onclick="setActivity('R')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16M8 7v10M14 7v10"/></svg>
        <span>Pausa</span>
      </button>
      <button class="act-btn" data-key="C" onclick="setActivity('C')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 18v-6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6"/><path d="M3 18h18"/></svg>
        <span>Cama</span>
      </button>
      <button class="act-btn" data-key="F" onclick="setActivity('F')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 16l1.5-5.5a2 2 0 0 1 2-1.5H18l3 7z"/><path d="M3 16h18v3H3z"/></svg>
        <span>Ferry</span>
      </button>
      <button class="act-btn" style="color:#eab308;" onclick="addArt12Note()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        <span>Art. 12.º</span>
      </button>
    </div>

    <!-- Estatísticas -->
    <div class="stats-row">
      <div class="stat-box"><div class="v num" id="workTotal">0h00</div><div class="k">Trabalho</div></div>
      <div class="stat-box"><div class="v num" id="kmCalculated">0 km</div><div class="k">Distância GPS</div></div>
      <div class="stat-box"><div class="v num" id="speedOver">0s</div><div class="k">>90 km/h</div></div>
    </div>

    <!-- Botões de Ação (Inclui Semanal) -->
    <div class="action-buttons">
      <button class="btn danger" id="btnEndDay">Ejetar Cartão</button>
      <button class="btn secondary" onclick="openWeeklyModal()">Semanal / Bi</button>
      <button class="btn secondary" onclick="openReportsModal()">PDF</button>
    </div>
  </div>

  <nav class="bottomnav">
    <button class="active">Hoje</button>
    <button onclick="openReportsModal()">Relatórios</button>
    <button onclick="alert('GPS Automático & Prevenção de Sono de Ecrã Ativos.')">Definições</button>
  </nav>
</div>

<!-- MODAL DE RELATÓRIOS -->
<div id="reportsModal" class="modal hidden">
  <div style="background:var(--surface);padding:16px;border-radius:14px;width:100%;max-width:440px;border:1px solid var(--border);">
    <h2 style="margin:0 0 10px 0;font-size:16px;">📊 Relatórios de Condução</h2>
    <div id="historyContent" style="max-height:260px;overflow-y:auto;margin-bottom:12px;font-size:12px;"></div>
    <button class="btn" onclick="generatePDF()" style="width:100%;margin-bottom:6px;background:var(--c-rest);">Exportar PDF Oficial</button>
    <button class="btn secondary" onclick="closeReportsModal()" style="width:100%;">Fechar</button>
  </div>
</div>

<!-- MODAL SEMANAL / BISSEMANAL -->
<div id="weeklyModal" class="modal hidden">
  <div style="background:var(--surface);padding:16px;border-radius:14px;width:100%;max-width:440px;border:1px solid var(--border);">
    <h2 style="margin:0 0 10px 0;font-size:16px;">📅 Acumulados (Regras UE)</h2>
    <div id="weeklyContent" style="font-size:13px;line-height:1.6;"></div>
    <button class="btn secondary" onclick="closeWeeklyModal()" style="width:100%;margin-top:12px;">Fechar</button>
  </div>
</div>

<script>
(function(){
"use strict";
const STORAGE_KEY = "tacho_v5_pro";
const LIM_CONT = 270 * 60 * 1000;
const LIM_DAILY = 540 * 60 * 1000;
const LIM_WEEKLY = 56 * 60 * 60 * 1000; // 56 horas
const LIM_BIWEEKLY = 90 * 60 * 60 * 1000; // 90 horas

// CORREÇÃO 1: try/catch no localStorage
let db = { users: ["Jonatan (Principal)", "Motorista 2"], userStates: {}, history: [] };
try {
  const stored = localStorage.getItem(STORAGE_KEY);
  if(stored) db = JSON.parse(stored);
} catch(e) {
  console.warn("Erro ao ler dados. A reiniciar base local.");
}

let activeUser = "";
let lastCoords = null;
let stopTimer = null;
let wakeLock = null;
let over90Timer = null; // Para contar segundos reais de excesso

function saveDB(){ 
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch(e) { alert("Aviso: Armazenamento cheio ou bloqueado."); } 
}

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator && wakeLock === null) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (err) {}
}

// CORREÇÃO 5: Reativar no iPhone quando volta ao ecrã
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    requestWakeLock();
    if(activeUser && db.userStates[activeUser] && db.userStates[activeUser].current) render();
  }
});

function initUsers(){
  const sel = document.getElementById("userSelect");
  sel.innerHTML = "";
  db.users.forEach(u => {
    const opt = document.createElement("option");
    opt.value = u; opt.textContent = u;
    sel.appendChild(opt);
  });
  checkUserRestStatus();
}

window.checkUserRestStatus = function(){
  const user = document.getElementById("userSelect").value;
  const state = db.userStates[user];
  const warn = document.getElementById("restWarning");
  
  // CORREÇÃO 2: Lógica repouso mais permissiva
  if(state && state.lastLogoutTime && ["R","C","F"].includes(state.lastActivity)){
    const elapsedMs = Date.now() - state.lastLogoutTime;
    const restMin = Math.floor(elapsedMs / (60 * 1000));
    warn.style.display = "block";
    warn.textContent = `Cartão de ${user}: Repouso contínuo desde a saída (${restMin} min registados).`;
  } else {
    warn.style.display = "none";
  }
};

function getDistanceKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

if("geolocation" in navigator){
  navigator.geolocation.watchPosition(pos => {
    const speed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
    document.getElementById("gpsSpeed").textContent = speed;

    const uState = db.userStates[activeUser];
    if(!uState || !uState.current) return;

    if(lastCoords && speed > 3){
      const dist = getDistanceKm(lastCoords.latitude, lastCoords.longitude, pos.coords.latitude, pos.coords.longitude);
      if(dist < 2.0){ 
        uState.current.gpsKm = (uState.current.gpsKm || 0) + dist;
        saveDB();
      }
    }
    lastCoords = pos.coords;

    const curAct = getCurrentAct();
    if(speed >= 8){
      if(stopTimer){ clearTimeout(stopTimer); stopTimer = null; }
      if(curAct !== "D") setActivity("D");
    } else if(speed < 3 && curAct === "D"){
      if(!stopTimer){
        stopTimer = setTimeout(() => {
          if(getCurrentAct() === "D") setActivity("R");
        }, 3 * 60 * 1000);
      }
    }

    // CORREÇÃO 4: Contagem de >90 km/h em segundos reais (usando setTimeout)
    if(speed > 90){
      document.body.classList.add("flash-red");
      if(!over90Timer) {
        over90Timer = setInterval(() => {
          if(db.userStates[activeUser] && db.userStates[activeUser].current) {
            db.userStates[activeUser].current.over90 = (db.userStates[activeUser].current.over90 || 0) + 1;
            saveDB();
          }
        }, 1000);
      }
    } else {
      document.body.classList.remove("flash-red");
      if(over90Timer) { clearInterval(over90Timer); over90Timer = null; }
    }
  }, null, { enableHighAccuracy: true });
}

function getCurrentAct(){
  const uState = db.userStates[activeUser];
  return (uState && uState.current && uState.current.segs.length) ? uState.current.segs[uState.current.segs.length-1][0] : null;
}

// CORREÇÃO 3: Prevenção de sobreposição de segmentos
window.setActivity = function(key){
  const uState = db.userStates[activeUser];
  if(!uState || !uState.current) return;
  const segs = uState.current.segs;
  const now = Date.now();
  
  // Se já estamos na mesma atividade, não duplica
  if(segs.length && segs[segs.length-1][0] === key && segs[segs.length-1][2] == null) return;

  // Fecha o último segmento aberto
  if(segs.length && segs[segs.length-1][2] == null) segs[segs.length-1][2] = now;
  
  segs.push([key, now, null]);
  saveDB();
  render();
};

function render(){
  const uState = db.userStates[activeUser];
  if(!uState || !uState.current) return;
  const now = Date.now();
  let driveMs = 0, workMs = 0;

  uState.current.segs.forEach(s => {
    const dur = (s[2] || now) - s[1];
    if(s[0] === "D") driveMs += dur;
    if(s[0] === "D" || s[0] === "T" || s[0] === "L") workMs += dur;
  });

  const contRemain = Math.max(0, LIM_CONT - driveMs);
  const dailyRemain = Math.max(0, LIM_DAILY - driveMs);
  const currentOdo = (parseFloat(uState.current.odoStart) || 0) + (uState.current.gpsKm || 0);

  document.getElementById("contTimer").textContent = fmtHMS(contRemain);
  document.getElementById("dailyTimer").textContent = fmtHM(dailyRemain);
  document.getElementById("contSub").textContent = "Efetuado: " + fmtHM(driveMs);
  document.getElementById("dailySub").textContent = "Efetuado: " + fmtHM(driveMs);
  document.getElementById("workTotal").textContent = fmtHM(workMs);
  document.getElementById("kmCalculated").textContent = (uState.current.gpsKm || 0).toFixed(1) + " km";
  document.getElementById("odoDisplay").textContent = "ODO: " + Math.round(currentOdo) + " km";
  document.getElementById("speedOver").textContent = (uState.current.over90 || 0) + "s";

  if(getCurrentAct() === "D" && contRemain <= 15*60*1000){
    document.body.classList.add("flash-yellow");
  } else {
    document.body.classList.remove("flash-yellow");
  }

  const curKey = getCurrentAct();
  document.querySelectorAll(".act-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.key === curKey);
  });
}

function fmtHMS(ms){
  const t = Math.floor(ms/1000);
  return `${Math.floor(t/3600)}:${String(Math.floor((t%3600)/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`;
}
function fmtHM(ms){
  const t = Math.floor(ms/1000);
  return `${Math.floor(t/3600)}h${String(Math.floor((t%3600)/60)).padStart(2,"0")}`;
}

document.getElementById("btnStart").addEventListener("click", ()=>{
  activeUser = document.getElementById("userSelect").value;
  const plate = (document.getElementById("sPlate").value || "S/MATRICULA").toUpperCase();
  const odoStart = parseFloat(document.getElementById("sOdo").value) || 0;

  if(!db.userStates[activeUser]) db.userStates[activeUser] = {};
  
  db.userStates[activeUser].current = {
    start: Date.now(), plate, odoStart, gpsKm: 0, segs: [["T", Date.now(), null]], over90: 0
  };
  saveDB();
  requestWakeLock();

  document.getElementById("driverDisplay").textContent = "Condutor: " + activeUser;
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  render();
});

document.getElementById("btnEndDay").addEventListener("click", ()=>{
  if(confirm("Ejetar cartão e guardar jornada?")){
    const uState = db.userStates[activeUser];
    if(uState && uState.current){
      // Fechar o último segmento antes de guardar
      const segs = uState.current.segs;
      if(segs.length && segs[segs.length-1][2] == null) segs[segs.length-1][2] = Date.now();

      uState.lastLogoutTime = Date.now();
      uState.lastActivity = segs[segs.length-1][0];
      
      // Guardar no histórico limpo
      db.history.push({ user: activeUser, ...uState.current, end: Date.now() });
      uState.current = null;
      saveDB();
    }
    location.reload();
  }
});

/* LÓGICA DE CÁLCULO SEMANAL / BISSEMANAL */
window.openWeeklyModal = function() {
  const now = Date.now();
  let weekMs = 0;
  let biweekMs = 0;
  
  // 7 dias e 14 dias em milissegundos
  const DAY = 24 * 60 * 60 * 1000;
  
  db.history.forEach(h => {
    const duration = h.end - h.start;
    if(now - h.end <= 7 * DAY) weekMs += duration;
    if(now - h.end <= 14 * DAY) biweekMs += duration;
  });
  
  // Adiciona a sessão atual (se estiver logado)
  if(activeUser && db.userStates[activeUser] && db.userStates[activeUser].current) {
    const curr = db.userStates[activeUser].current;
    let driveMsCurr = 0;
    curr.segs.forEach(s => {
      const dur = (s[2] || now) - s[1];
      if(s[0] === "D") driveMsCurr += dur;
    });
    weekMs += driveMsCurr;
    biweekMs += driveMsCurr;
  }

  const wRem = Math.max(0, LIM_WEEKLY - weekMs);
  const bRem = Math.max(0, LIM_BIWEEKLY - biweekMs);

  document.getElementById("weeklyContent").innerHTML = `
    <div style="background:var(--surface-2);padding:10px;border-radius:8px;margin-bottom:8px;">
      <strong>Esta Semana (Últimos 7 dias)</strong><br>
      Conduzido: <span class="num" style="color:var(--c-drive);font-size:16px;">${fmtHM(weekMs)}</span><br>
      Limite Legal: 56h00<br>
      Restante: <span style="color:var(--c-rest);">${fmtHM(wRem)}</span>
    </div>
    <div style="background:var(--surface-2);padding:10px;border-radius:8px;">
      <strong>Bissemanal (Últimos 14 dias)</strong><br>
      Conduzido: <span class="num" style="color:var(--c-drive);font-size:16px;">${fmtHM(biweekMs)}</span><br>
      Limite Legal: 90h00<br>
      Restante: <span style="color:var(--c-rest);">${fmtHM(bRem)}</span>
    </div>
  `;
  document.getElementById("weeklyModal").classList.remove("hidden");
};

window.closeWeeklyModal = function(){
  document.getElementById("weeklyModal").classList.add("hidden");
};

/* RELATÓRIOS E PDF */
window.openReportsModal = function(){
  const div = document.getElementById("historyContent");
  div.innerHTML = "";
  if(!db.history.length){
    div.innerHTML = "<p style='color:var(--muted);'>Sem registos de jornadas no histórico.</p>";
  } else {
    db.history.slice().reverse().forEach(h => {
      div.innerHTML += `<div style='background:var(--surface-2);padding:8px;margin-bottom:6px;border-radius:6px;'>
        <strong>${h.user}</strong> — ${new Date(h.start).toLocaleDateString("pt-PT")}<br>
        Matrícula: ${h.plate} | Distância GPS: ${(h.gpsKm||0).toFixed(1)} km<br>
        Infrações >90km/h: ${h.over90||0}s
      </div>`;
    });
  }
  document.getElementById("reportsModal").classList.remove("hidden");
};

window.closeReportsModal = function(){
  document.getElementById("reportsModal").classList.add("hidden");
};

// CORREÇÃO FINAL: Geração de PDF Real
window.generatePDF = function(){
  if(!window.jspdf || !window.jspdf.jsPDF) {
    return alert("Biblioteca PDF a carregar. Tente novamente em 2 segundos.");
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  
  doc.setFontSize(18);
  doc.text("Relatório de Atividade - Tacógrafo V5", 14, 20);
  
  doc.setFontSize(11);
  doc.text("Condutor: " + (activeUser || "Sem Login"), 14, 30);
  doc.text("Data de Emissão: " + new Date().toLocaleString("pt-PT"), 14, 38);

  let y = 50;
  doc.setFontSize(12);
  doc.text("Histórico de Jornadas Recentes:", 14, y);
  y += 10;

  db.history.slice(-10).reverse().forEach((h, i) => {
    if(y > 270) { doc.addPage(); y = 20; }
    doc.setFontSize(10);
    doc.text(`${new Date(h.start).toLocaleDateString("pt-PT")} - ${h.plate || "S/M"}`, 14, y);
    doc.text(`Km GPS: ${(h.gpsKm||0).toFixed(1)} | Infrações >90: ${h.over90||0}s`, 14, y + 5);
    y += 14;
  });

  doc.save("Tacografo_Relatorio.pdf");
};

setInterval(()=>{
  if(activeUser && db.userStates[activeUser] && db.userStates[activeUser].current) render();
  const d = new Date();
  document.getElementById("clockTime").textContent = d.toLocaleTimeString("pt-PT");
}, 1000);

initUsers();
})();
</script>
